name: CI

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Test
        run: make test
      - name: Smoke test CLI and ATF
        run: |
          ./amiterrain generate 64 64 6502 terrain.pgm
          ./amiterrain validate terrain.pgm
          ./amiterrain convert terrain.pgm terrain.atf
          ./amiterrain validate terrain.atf
          ./amiterrain convert terrain.atf roundtrip.pgm
          ./amiterrain convert terrain.atf terrain.raw
          test "$(stat -c%s terrain.raw)" = "8192"
          test "$(./amiterrain info terrain.pgm | sed 's/.*checksum=//')" = "$(./amiterrain info terrain.atf | sed 's/.*checksum=//')"
          ./amiterrain convert --input-format pgm terrain.pgm --output-format wcs-elev terrain.elev
          ./amiterrain validate terrain.elev
          ./amiterrain convert --input-format wcs-elev terrain.elev --output-format atf from-wcs.atf
          ./amiterrain validate from-wcs.atf
          ./amiterrain convert --input-format pgm terrain.pgm --output-format vista-array terrain.dem
          ./amiterrain convert --input-format vista-array --width 64 --height 64 terrain.dem --output-format atf from-vista.atf
          ./amiterrain validate from-vista.atf
          python3 - <<'PY'
          import struct
          vals=[100,101,-32768,102,103,104,105,106,107]
          with open("N58E007.hgt","wb") as f:
              f.write(struct.pack(">9h",*vals))
          PY
          ./amiterrain info N58E007.hgt
          ./amiterrain validate N58E007.hgt
          ./amiterrain convert N58E007.hgt from-hgt.atf
          ./amiterrain validate from-hgt.atf
          printf 'ncols 3\nnrows 2\nxllcorner 100\nyllcorner 200\ncellsize 10\nNODATA_value -9999\n1 2 -9999\n-1 0 3\n' > terrain.asc
          ./amiterrain info terrain.asc
          ./amiterrain validate terrain.asc
          ./amiterrain convert terrain.asc from-asc.atf
          ./amiterrain validate from-asc.atf
          printf '7 59 10\n7.5 59 11\n8 59 12\n7 58.5 -1\n7.5 58.5 0\n8 58.5 1\n' > terrain.xyz
          ./amiterrain info terrain.xyz
          ./amiterrain validate terrain.xyz
          ./amiterrain convert terrain.xyz from-xyz.atf
          ./amiterrain validate from-xyz.atf
          test "$(./amiterrain info N58E007.hgt | sed 's/.*checksum=//' | cut -d' ' -f1)" = "$(./amiterrain info from-hgt.atf | sed 's/.*checksum=//' | cut -d' ' -f1)"
